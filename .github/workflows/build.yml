name: Build

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 9.0.x

      - name: Extract version from PluginVersion
        id: changelog
        run: |
          VERSION=$(grep -m 1 -Po '(?<=PluginVersion = \")[0-9]+\.[0-9]+\.[0-9]+' ProliferatorMultiplier/ProliferatorMultiplier.cs)
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in ProliferatorMultiplier.cs"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build (Release)
        run: dotnet build . --configuration Thunderstore -p:Version=${{ env.VERSION }}

